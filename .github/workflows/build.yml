name: build

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: GakumasLauncher-windows
          - os: ubuntu-latest
            artifact: GakumasLauncher-linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # The launcher reads LAUNCHER_VERSION at compile time, so Cargo.toml and
      # Cargo.lock stay untouched and the build can stay --locked.
      # tauri.conf.json only feeds the executable's file properties.
      - name: Set version from release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-PRERELEASE]" >&2
            exit 1
          fi
          echo "LAUNCHER_VERSION=$VERSION" >> "$GITHUB_ENV"
          python - "$VERSION" <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("tauri.conf.json")
          conf = json.loads(p.read_text(encoding="utf-8"))
          conf["version"] = sys.argv[1]
          p.write_text(json.dumps(conf, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

      - name: Build
        run: cargo build --release --locked --bins

      - name: Collect (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/GakumasLauncher.exe dist/

      - name: Collect (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/GakumasLauncher dist/

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: GakumasLauncher-*
          path: dist
          merge-multiple: true

      - name: Name Linux asset
        run: cp dist/GakumasLauncher dist/GakumasLauncher-linux

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            dist/GakumasLauncher.exe
            dist/GakumasLauncher-linux
          generate_release_notes: true
          fail_on_unmatched_files: true
