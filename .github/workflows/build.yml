name: build

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: GakumasLauncher-windows
          - os: ubuntu-latest
            artifact: GakumasLauncher-linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set version from release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python - "$VERSION" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path("Cargo.toml")
          text = p.read_text()
          p.write_text(re.sub(r'(?m)^version = "[^"]+"', f'version = "{sys.argv[1]}"', text, count=1))
          PY

      - name: Build
        run: cargo build --release --bins

      - name: Collect (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/GakumasLauncher.exe dist/

      - name: Collect (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/GakumasLauncher dist/

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: GakumasLauncher-*
          path: dist
          merge-multiple: true

      - name: Name Linux asset
        run: cp dist/GakumasLauncher dist/GakumasLauncher-linux

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            dist/GakumasLauncher.exe
            dist/GakumasLauncher-linux
          generate_release_notes: true
          fail_on_unmatched_files: true
