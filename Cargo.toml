[package]
name = "gakumas-launcher"
version = "0.3.0"
edition = "2021"
publish = false
license = "MIT"
description = "DMM Gakumas launcher with a built-in user-space VPN (VPN Gate) for the region check"

[[bin]]
name = "GakumasLauncher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# UI (WebView2). The login window is an in-app WebView2 window, not an external browser.
tauri = { version = "2", features = [] }
# Native folder picker for the game folder.
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# TLS: OpenVPN control channel and HTTPS to DMM. ring backend builds with MSVC alone (no NASM/CMake).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
# User-space TCP/IP stack: no virtual network adapter, no route changes.
smoltcp = { version = "=0.11.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"] }
# OpenVPN data channel (AES-128-CBC + HMAC-SHA1) and key derivation (TLS 1.0 PRF).
aes = "0.8"
cbc = { version = "0.1", features = ["std", "block-padding"] }
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
getrandom = "0.2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
httparse = "1"
# Plain HTTPS (login API, file list, game file downloads) over the normal connection.
ureq = { version = "2", default-features = false, features = ["tls", "native-tls", "cookies", "gzip"] }
cookie_store = { version = "0.21.1", default-features = false }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile = "3"
# TLS for www.vpngate.net, which only offers TLS 1.2 CBC suites that rustls does not support.
# Uses schannel on Windows and OpenSSL on Linux.
native-tls = "0.2"
boringtun = "0.7.1"
ring = "0.17"
ctr = "0.9"
# Launcher self-update: swap the running executable for a verified download.
self-replace = "1.5"
semver = "1"

[target.'cfg(windows)'.dependencies]
# Same versions Tauri/wry use; only for switching on WebView2's own password save in the login window.
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Same version GTK/Tauri use; only to set the program name, which GTK 3 sends
# to Wayland compositors as the window's app id.
glib = "0.18"

[profile.release]
# Balance binary size and runtime speed:
# - Default to size optimization (`"s"`) with full LTO, symbol stripping, and
#   abort-on-panic so Tauri/WebView2/UI glue stays compact.
# - Optimize CPU-bound VPN, crypto, TLS, TCP/IP, and decompression crates for speed.
opt-level = "s"
lto = true
strip = true
panic = "abort"

[profile.release.package.aes]
opt-level = 3
[profile.release.package.blake2]
opt-level = 3
[profile.release.package.boringtun]
opt-level = 3
[profile.release.package.cbc]
opt-level = 3
[profile.release.package.chacha20]
opt-level = 3
[profile.release.package.chacha20poly1305]
opt-level = 3
[profile.release.package.ctr]
opt-level = 3
[profile.release.package.flate2]
opt-level = 3
[profile.release.package.hmac]
opt-level = 3
[profile.release.package.md-5]
opt-level = 3
[profile.release.package.poly1305]
opt-level = 3
[profile.release.package.ring]
opt-level = 3
[profile.release.package.rustls]
opt-level = 2
[profile.release.package.sha1]
opt-level = 3
[profile.release.package.smoltcp]
opt-level = 2
[profile.release.package.x25519-dalek]
opt-level = 3
[profile.release.package.zlib-rs]
opt-level = 3
